<style>

/* Mobile Bottom Sheet Layout */
@media only screen and (max-width: 600px) {
  .nav-dialog {
    width: 100%;

    bottom: 0;
    left: 0;

    border-radius: 26px 26px 0 0;
    animation: navSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .nav-dialog-container {
    border-radius: 26px 26px 0 0;
    border-bottom: none;
    padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
    gap: 16px;
  }

  .nav-dialog-drag-handle {

</style>

<script>
(function() {
  const modal = document.getElementById('navigation-modal');
  if (!modal) return;

  const closeBtn = document.getElementById('nav-modal-close');
  const copyBtn = document.getElementById('nav-copy-trigger');
  const copyLabel = document.getElementById('nav-copy-text');
  const addressVal = document.getElementById('nav-address-val');

  const linkGoogle = document.getElementById('nav-link-google');
  const linkWaze = document.getElementById('nav-link-waze');
  const linkNeshan = document.getElementById('nav-link-neshan');
  const linkBalad = document.getElementById('nav-link-balad');

  let defaultLat = '35.800922';
  let defaultLng = '50.904596';
  let defaultAddress = 'مهرشهر - خیابان ۱۱۱ - نبش عرفان';

  function updateLinks(lat, lng) {
    if (linkGoogle) {
      linkGoogle.href = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
    }
    if (linkWaze) {
      linkWaze.href = 'https://waze.com/ul?ll=' + lat + ',' + lng + '&navigate=yes';
    }
    if (linkNeshan) {
      linkNeshan.href = 'https://neshan.org/maps/@' + lat + ',' + lng + ',16z';
    }
    if (linkBalad) {
      linkBalad.href = 'https://balad.ir/location?latitude=' + lat + '&longitude=' + lng;
    }
  }

  function openModal(cardOrLink) {
    if (cardOrLink) {
      const geoUrl = cardOrLink.getAttribute('href') || '';
      const match = geoUrl.match(/geo:([0-9.]+)[,\s%20]+([0-9.]+)/i);
      if (match && match[1] && match[2]) {
        updateLinks(match[1], match[2]);
      } else {
        updateLinks(defaultLat, defaultLng);
      }

      const textElem = cardOrLink.querySelector('.contact-value');
      const address = textElem ? textElem.textContent.trim() : (cardOrLink.getAttribute('data-value') || defaultAddress);
      if (addressVal && address) {
        addressVal.textContent = address;
      }
    } else {
      updateLinks(defaultLat, defaultLng);
    }

    if (typeof modal.showModal === 'function') {
      modal.showModal();
    } else {
      modal.setAttribute('open', '');
    }
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    if (typeof modal.close === 'function') {
      modal.close();
    } else {
      modal.removeAttribute('open');
    }
    document.body.style.overflow = '';
  }

  // Intercept click on any contact card with map or geo: link
  document.addEventListener('click', function(e) {
    const trigger = e.target.closest('[data-map-modal="true"], a[href^="geo:"]');
    if (trigger) {
      e.preventDefault();
      openModal(trigger);
    }
  });

  if (closeBtn) {
    closeBtn.addEventListener('click', closeModal);
  }

  // Close when clicking dialog backdrop
  modal.addEventListener('click', function(e) {
    const rect = modal.getBoundingClientRect();
    const isInDialog = (
      e.clientX >= rect.left &&
      e.clientX <= rect.right &&
      e.clientY >= rect.top &&
      e.clientY <= rect.bottom
    );
    if (!isInDialog) {
      closeModal();
    }
  });

  // Automatically close modal after user clicks any app link so it doesn't linger
  modal.querySelectorAll('a.nav-app-btn, a.nav-pill-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      setTimeout(closeModal, 400);
    });
  });

  // Copy address to clipboard
  if (copyBtn) {
    copyBtn.addEventListener('click', function() {
      const textToCopy = (addressVal ? addressVal.textContent : defaultAddress).trim();
      navigator.clipboard.writeText(textToCopy).then(function() {
        if (copyLabel) copyLabel.textContent = 'کپی شد! ✓';
        copyBtn.classList.add('copied');
        setTimeout(function() {
          if (copyLabel) copyLabel.textContent = 'کپی';
          copyBtn.classList.remove('copied');
        }, 2200);
      }).catch(function() {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = textToCopy;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        if (copyLabel) copyLabel.textContent = 'کپی شد! ✓';
        copyBtn.classList.add('copied');
        setTimeout(function() {
          if (copyLabel) copyLabel.textContent = 'کپی';
          copyBtn.classList.remove('copied');
        }, 2200);
      });
    });
  }
})();
</script>
